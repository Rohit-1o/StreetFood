<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="home">

  <nav class="navbar p-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="./images/logo-removebg-preview (1).png" alt="Logo" width="45" height="45" class="me-2">
        <b>DESI SWAAD</b>
      </a>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-dark" id="cartToggle" type="button">
          Cart <span class="badge bg-dark" id="cartCount">0</span>
        </button>

        <a href="index.html" class="btn btn-outline-dark">
          Home
        </a>
      </div>
    </div>
  </nav>

  <!-- Added margin-top so the content is below the navbar -->
  <div class="container py-4" style="margin-top:90px;">

    <div class="cart-page-shell">

      <div class="cart-page-card">

        <div class="cart-page-header">

          <div>
            <h1 class="mb-1">Your Cart</h1>
            <p class="cart-page-message" id="cartMessage">
              Your cart is empty.
            </p>
          </div>

          <a href="index.html" class="btn btn-outline-dark">
            Continue Shopping
          </a>

        </div>

        <ul id="cartItems" class="cart-page-items"></ul>

        <div class="cart-page-summary">

          <div class="cart-total-row">
            <span>Total</span>
            <strong id="cartTotal">₹0</strong>
          </div>

          <div class="cart-action-buttons">
            <button class="btn btn-main w-100" id="checkoutBtn" type="button">
              Proceed to Pay
            </button>

            <button class="btn btn-main w-100" id="orderBtn" type="button">
              Order
            </button>
          </div>

        </div>

      </div>

    </div>

  </div>

  <div id="modalOverlay" class="modal-overlay"></div>

  <div id="paymentModal" class="payment-modal">
    <div id="paymentContent"></div>
  </div>

  <script src="./javascript/js/script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .orders-container { max-width: 880px; margin: 100px auto; padding: 20px; }
    .order-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
  </style>
</head>
<body>
  <nav class="navbar p-3">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand d-flex align-items-center" href="home.html">
        <img src="./images/logo-removebg-preview (1).png" alt="Logo" width="40" height="40" class="me-2">DESI SWAAD
      </a>
      <div>
        <a href="home.html"><button class="btn btn-outline-dark">Home</button></a>
        <a href="login.html"><button class="btn btn-main ms-2">Login</button></a>
      </div>
    </div>
  </nav>

  <div class="orders-container">
    <h2>Your Orders</h2>
    <div id="ordersList"></div>
    <p id="noOrders" class="text-muted">No orders yet.</p>
    <a href="home.html"><button class="submit-btn mt-3">Back to Home</button></a>
  </div>

  <script>
    const orders = JSON.parse(localStorage.getItem('desiswaad-orders') || '[]');
    const list = document.getElementById('ordersList');
    const noOrders = document.getElementById('noOrders');
    if (!orders.length) {
      noOrders.style.display = 'block';
    } else {
      noOrders.style.display = 'none';
      orders.reverse().forEach((o) => {
        const div = document.createElement('div');
        div.className = 'order-card';
        div.innerHTML = `<strong>Order #${o.id}</strong><div>${o.items.map(i=>`${i.name} x ${i.quantity}`).join(', ')}</div><div>Total: ₹${o.total}</div><div>${o.date}</div>`;
        list.appendChild(div);
      });
    }
  </script>
</body>
</html>
